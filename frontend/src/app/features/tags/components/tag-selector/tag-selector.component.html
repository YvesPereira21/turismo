<div class="space-y-2">
  <label class="text-sm font-semibold text-gray-500 font-poppins">Tags (selecione as categorias)</label>
  <div>
    <button 
      type="button" 
      (click)="openTagModal()"
      class="inline-flex items-center gap-2 rounded-xl bg-white border border-gray-200 hover:border-[#6EB57D] px-4 py-2 text-sm font-medium text-gray-700 hover:text-[#2C5C3E] transition-all shadow-sm hover:shadow cursor-pointer"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      Selecionar Tags
    </button>
  </div>

  <!-- Selected Tags Preview -->
  <div class="flex flex-wrap gap-1.5 pt-1">
    @for (control of tagsNames().controls; track control.value) {
      <span class="inline-flex items-center gap-1.5 px-3 py-1 mb-1 rounded-full border border-[#6EB57D]/30 bg-[#2C5C3E]/10 text-[#2C5C3E] text-xs font-bold font-poppins shadow-sm">
        #{{ control.value }}
        <button 
          type="button" 
          (click)="toggleTag(control.value)" 
          class="hover:text-[#20442E] transition-colors focus:outline-none cursor-pointer"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3.5 h-3.5">
            <path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z" />
          </svg>
        </button>
      </span>
    }
  </div>
</div>

<dialog class="modal" [class.modal-open]="isModalOpen()">
  <div class="modal-box bg-white border border-gray-100 p-0 overflow-hidden flex flex-col max-h-[80vh] max-w-md shadow-2xl rounded-2xl">
    
    <!-- Modal Header -->
    <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
      <h3 class="text-lg font-bold font-roboto-slab text-[#2C5C3E]">Selecionar Tags</h3>
      <button 
        type="button" 
        (click)="closeTagModal()" 
        class="btn btn-sm btn-ghost btn-circle text-gray-500 hover:text-gray-700"
      >
        ✕
      </button>
    </div>

    <!-- Tags List -->
    <div class="flex-1 overflow-y-auto p-4 custom-scroll max-h-[40vh]">
      <div class="flex flex-wrap gap-2">
        @for (tag of tags(); track tag.name) {
          <button 
            type="button" 
            (click)="toggleTag(tag.name)" 
            [class]="isTagSelected(tag.name) 
              ? 'bg-[#2C5C3E]/10 border-[#6EB57D] text-[#2C5C3E] shadow-sm font-semibold' 
              : 'bg-gray-50 border-gray-100 text-gray-600 hover:border-[#6EB57D] hover:text-[#2C5C3E]'"
            class="px-3.5 py-1.5 rounded-full border text-xs font-poppins transition-all duration-200 cursor-pointer"
          >
            #{{ tag.name }}
          </button>
        } @empty {
          <div class="w-full text-center py-6 text-sm text-gray-400 font-poppins">
            Nenhuma tag encontrada.
          </div>
        }
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="p-4 border-t border-gray-100 flex justify-end bg-gray-50/30">
      <button 
        type="button" 
        (click)="closeTagModal()"
        class="rounded-xl bg-[#2C5C3E] hover:bg-[#20442E] px-6 py-2.5 text-sm font-medium font-poppins text-white shadow-md hover:shadow-lg transition-all cursor-pointer"
      >
        Pronto
      </button>
    </div>
  </div>

  <!-- Modal Backdrop to close when clicking outside -->
  <form method="dialog" class="modal-backdrop" (click)="closeTagModal()">
  </form>
</dialog>
