<main class="min-h-[calc(100vh-140px)] flex items-center justify-center p-4 bg-gradient-to-b from-gray-50 to-emerald-50/30">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-gray-100 p-8 flex flex-col gap-6">

        <!-- CABEÇALHO DO CARD -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-[#2C5C3E]/10 text-[#2C5C3E] mb-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                </svg>
            </div>
            <h1 class="font-roboto-slab font-bold text-2xl text-[#2C5C3E]">
                Acesse sua Conta
            </h1>
            <p class="font-poppins text-xs text-gray-500">
                Explore os encantos e pontos turísticos da Paraíba
            </p>
        </div>

        <!-- MENSAGEM DE ERRO -->
        @if (errorMessage()) {
        <div class="bg-red-50 text-red-600 border border-red-200 text-xs font-poppins p-3 rounded-xl flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>{{ errorMessage() }}</span>
        </div>
        }

        <!-- FORMULÁRIO TRADICIONAL -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4 font-poppins">
            <!-- E-mail -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wider">E-mail</label>
                <div class="relative">
                    <input type="email" formControlName="email" placeholder="seuemail@exemplo.com"
                        class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:outline-none focus:border-[#6EB57D] focus:ring-1 focus:ring-[#6EB57D] text-sm text-gray-700 transition-all placeholder:text-gray-400" />
                </div>
            </div>

            <!-- Senha -->
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Senha</label>
                    <a href="javascript:void(0)" class="text-xs text-[#2C5C3E] hover:underline font-medium">Esqueceu?</a>
                </div>
                <input type="password" formControlName="password" placeholder="••••••••"
                    class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:outline-none focus:border-[#6EB57D] focus:ring-1 focus:ring-[#6EB57D] text-sm text-gray-700 transition-all placeholder:text-gray-400" />
            </div>

            <!-- Botão Entrar -->
            <button type="submit" [disabled]="isSubmitting()"
                class="w-full py-3.5 px-4 bg-[#2C5C3E] hover:bg-[#234931] text-white font-poppins font-medium text-sm rounded-xl shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2 disabled:opacity-50">
                @if (isSubmitting()) {
                <span class="loading loading-spinner loading-sm"></span>
                <span>Entrando...</span>
                } @else {
                <span>Entrar na Conta</span>
                }
            </button>
        </form>

        <!-- DIVISOR OU -->
        <div class="relative flex items-center justify-center my-1">
            <div class="border-t border-gray-200 w-full"></div>
            <span class="bg-white px-3 text-[11px] font-poppins font-semibold text-gray-400 uppercase tracking-wider absolute">ou continue com</span>
        </div>

        <!-- OAUTH2 GOOGLE BUTTON -->
        <a href="http://localhost:8080/oauth2/authorization/google"
            class="w-full py-3 px-4 bg-white hover:bg-gray-50 text-gray-700 font-poppins font-medium text-sm rounded-xl border border-gray-200 shadow-sm hover:shadow transition-all flex items-center justify-center gap-3">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4"
                    d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" />
                <path fill="#34A853"
                    d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.25 21.3 7.31 24 12 24z" />
                <path fill="#FBBC05"
                    d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.16 0 9.99 0 12s.46 3.84 1.26 5.42l4.02-3.15z" />
                <path fill="#EA4335"
                    d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z" />
            </svg>
            <span>Entrar com o Google</span>
        </a>

        <!-- OPÇÕES DE CADASTRO -->
        <div class="pt-2 border-t border-gray-100 space-y-3">
            <p class="text-center font-poppins text-xs font-medium text-gray-500">
                Ainda não possui uma conta? <span class="text-gray-700 font-semibold">Cadastre-se como:</span>
            </p>

            <div class="grid grid-cols-2 gap-3">
                <a routerLink="/create-tourist"
                    class="p-3 rounded-xl border border-gray-200 hover:border-[#6EB57D] hover:bg-[#6EB57D]/10 text-center transition-all group">
                    <span class="block text-xs font-poppins font-semibold text-gray-700 group-hover:text-[#2C5C3E]">Turista</span>
                </a>

                <a routerLink="/create-tour-guide"
                    class="p-3 rounded-xl border border-gray-200 hover:border-[#6EB57D] hover:bg-[#6EB57D]/10 text-center transition-all group">
                    <span class="block text-xs font-poppins font-semibold text-gray-700 group-hover:text-[#2C5C3E]">Guia de Turismo</span>
                </a>
            </div>
        </div>

    </div>
</main>
