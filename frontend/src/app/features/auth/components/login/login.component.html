<main class="min-h-[calc(100vh-80px)] flex items-center justify-center p-4 bg-[#f3f4f6]">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-gray-200 p-8 flex flex-col gap-6">

        <!-- CABEÇALHO DO CARD -->
        <div class="text-center space-y-2">
            <h1 class="font-roboto-slab font-bold text-3xl text-[#2C5C3E]">
                Acesse sua conta
            </h1>
            <p class="font-poppins text-sm text-gray-500">
                Explore os encantos e pontos turísticos da Paraíba
            </p>
        </div>

        <!-- MENSAGEM DE ERRO -->
        @if (errorMessage()) {
        <div class="bg-red-50 text-red-600 border border-red-200 text-sm font-poppins p-3 rounded-lg flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>{{ errorMessage() }}</span>
        </div>
        }

        <!-- FORMULÁRIO TRADICIONAL -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5 font-poppins">
            <!-- E-mail -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">E-mail</label>
                <div class="relative">
                    <input type="email" id="email" formControlName="email" autocomplete="username" required placeholder="seuemail@exemplo.com"
                        class="w-full px-4 py-2.5 rounded-lg bg-white border border-gray-300 focus:bg-white focus:outline-none focus:border-[#6EB57D] focus:ring-2 focus:ring-[#6EB57D]/30 text-sm text-gray-900 transition-all placeholder:text-gray-400" />
                </div>
            </div>

            <!-- Senha -->
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label for="password" class="block text-sm font-medium text-gray-700">Senha</label>
                    <a href="javascript:void(0)" class="text-sm text-[#2C5C3E] hover:text-[#1a3825] hover:underline font-medium transition-colors">Esqueceu a senha?</a>
                </div>
                <input type="password" id="password" formControlName="password" autocomplete="current-password" required placeholder="••••••••"
                    class="w-full px-4 py-2.5 rounded-lg bg-white border border-gray-300 focus:bg-white focus:outline-none focus:border-[#6EB57D] focus:ring-2 focus:ring-[#6EB57D]/30 text-sm text-gray-900 transition-all placeholder:text-gray-400" />
            </div>

            <!-- Botão Entrar -->
            <button type="submit" [disabled]="isSubmitting()"
                class="w-full py-2.5 px-4 bg-[#2C5C3E] hover:bg-[#1a3825] text-white font-poppins font-medium text-base rounded-lg transition-colors flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
                @if (isSubmitting()) {
                <span class="loading loading-spinner loading-sm"></span>
                <span>Entrando...</span>
                } @else {
                <span>Entrar</span>
                }
            </button>
        </form>

        <!-- DIVISOR OU -->
        <div class="relative flex items-center justify-center my-2">
            <div class="border-t border-gray-200 w-full"></div>
            <span class="bg-white px-4 text-xs font-poppins text-gray-500 absolute">ou continue com</span>
        </div>

        <!-- OAUTH2 GOOGLE BUTTON -->
        <a [href]="googleAuthUrl"
            class="w-full py-2.5 px-4 bg-white hover:bg-gray-50 text-gray-700 font-poppins font-medium text-sm rounded-lg border border-gray-300 transition-colors flex items-center justify-center gap-3">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4"
                    d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" />
                <path fill="#34A853"
                    d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.25 21.3 7.31 24 12 24z" />
                <path fill="#FBBC05"
                    d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.16 0 9.99 0 12s.46 3.84 1.26 5.42l4.02-3.15z" />
                <path fill="#EA4335"
                    d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z" />
            </svg>
            <span>Google</span>
        </a>

        <!-- OPÇÕES DE CADASTRO -->
        <div class="pt-4 border-t border-gray-100 text-center">
            <p class="font-poppins text-sm text-gray-600 mb-3">
                Ainda não possui uma conta?
            </p>
            <div class="flex flex-col sm:flex-row gap-2 justify-center">
                <a routerLink="/create-tourist"
                    class="px-4 py-2 rounded-lg bg-[#6EB57D]/10 text-[#2C5C3E] hover:bg-[#6EB57D]/20 text-sm font-poppins font-medium transition-colors">
                    Sou Turista
                </a>
                <a routerLink="/create-tour-guide"
                    class="px-4 py-2 rounded-lg bg-[#6EB57D]/10 text-[#2C5C3E] hover:bg-[#6EB57D]/20 text-sm font-poppins font-medium transition-colors">
                    Sou Guia de Turismo
                </a>
            </div>
        </div>

    </div>
</main>
