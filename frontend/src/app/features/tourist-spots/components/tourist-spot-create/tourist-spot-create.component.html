<form [formGroup]="touristSpotForm" (ngSubmit)="onSubmit()" class="w-full max-w-4xl mx-auto p-6 bg-base-100 shadow-lg rounded-2xl space-y-6">

    <h2 class="text-2xl font-bold text-[#2C5C3E] mb-6">Cadastrar Ponto Turístico</h2>

    <div class="form-control w-full">
        <label class="label" for="name">
            <span class="label-text font-semibold">Nome do Local</span>
        </label>
        <input id="name" type="text" formControlName="name" placeholder="Ex: Farol do Cabo Branco"
            class="input input-bordered w-full focus:outline-[#4A8C5E]" />
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="form-control w-full">
            <label class="label" for="opensAt">
                <span class="label-text font-semibold">Horário de Abertura</span>
            </label>
            <input id="opensAt" type="time" formControlName="opensAt"
                class="input input-bordered w-full focus:outline-[#4A8C5E]" />
        </div>

        <div class="form-control w-full">
            <label class="label" for="closesAt">
                <span class="label-text font-semibold">Horário de Fechamento</span>
            </label>
            <input id="closesAt" type="time" formControlName="closesAt"
                class="input input-bordered w-full focus:outline-[#4A8C5E]" />
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="form-control w-full">
            <label class="label" for="state">
                <span class="label-text font-semibold">Estado</span>
            </label>
            <select id="state" (change)="onStateChange($event)"
                class="select select-bordered w-full focus:outline-[#4A8C5E] bg-white text-gray-800 font-poppins">
                <option value="" disabled selected class="text-gray-400 bg-white">Selecione o estado</option>
                @for (state of states(); track state.stateId) {
                <option [value]="state.name" class="text-gray-800 bg-white">{{ state.name }}</option>
                }
            </select>
        </div>

        <div class="form-control w-full">
            <label class="label" for="cityId">
                <span class="label-text font-semibold">Cidade</span>
            </label>
            <select id="cityId" formControlName="cityId"
                class="select select-bordered w-full focus:outline-[#4A8C5E] bg-white text-gray-800 font-poppins">
                <option value="" disabled selected class="text-gray-400 bg-white">
                    {{ cities().length === 0 ? 'Selecione o estado primeiro' : 'Selecione a cidade' }}
                </option>
                @for (city of cities(); track city.cityId) {
                <option [value]="city.cityId" class="text-gray-800 bg-white">{{ city.name }}</option>
                }
            </select>
        </div>

        <div class="form-control w-full">
            <label class="label" for="spotManagerId">
                <span class="label-text font-semibold">ID do Gerente Responsável</span>
            </label>
            <input id="spotManagerId" type="text" formControlName="spotManagerId" placeholder="Ex: 123"
                class="input input-bordered w-full focus:outline-[#4A8C5E]" />
        </div>
    </div>

    <div class="form-control w-full">
        <label class="label" for="shortDescription">
            <span class="label-text font-semibold">Breve Descrição (Resumo)</span>
        </label>
        <input id="shortDescription" type="text" formControlName="shortDescription"
            placeholder="Uma frase curta sobre o local..."
            class="input input-bordered w-full focus:outline-[#4A8C5E]" />
    </div>

    <div class="form-control w-full">
        <label class="label" for="description">
            <span class="label-text font-semibold">Descrição Completa</span>
        </label>
        <textarea id="description" formControlName="description" rows="4"
            placeholder="Detalhes completos sobre o ponto turístico..."
            class="textarea textarea-bordered w-full focus:outline-[#4A8C5E]"></textarea>
    </div>

    <app-tag-selector [tagsNames]="tagsArray"></app-tag-selector>

    <div class="form-control w-full mt-6">
        <label class="label" for="photos">
            <span class="label-text font-semibold text-gray-700">Fotos do Local</span>
        </label>

        <input id="photos" type="file" multiple accept="image/*" (change)="onFilesSelected($event)"
            class="file-input file-input-bordered w-full focus:outline-[#4A8C5E]" />

        @if (photos().length > 0) {
        <div class="mt-4 space-y-3 p-4 bg-gray-50 rounded-lg">
            <h4 class="font-semibold text-gray-700 text-sm">Textos Alternativos para acessibilidade</h4>

            @for (photo of photos(); track photo.photo.name; let i = $index) {
            <div class="flex flex-col md:flex-row md:items-center gap-3">

                <span class="text-sm text-gray-600 md:w-1/3 truncate font-medium" title="{{ photo.photo.name }}">
                    {{ photo.photo.name }}
                </span>

                <input type="text" placeholder="Descreva a imagem. Ex: Vista superior da praia..."
                    [value]="photo.altText" (input)="updateAlternateTextInForm(i, $event)"
                    class="input input-sm input-bordered w-full" />
            </div>
            }
        </div>
        }
    </div>

    <div class="form-control mt-8">
        <button type="submit" class="btn bg-[#4A8C5E] hover:bg-[#2C5C3E] text-white w-full md:w-auto md:px-10"
            [disabled]="isSubmiting() || touristSpotForm.invalid">
            @if(isSubmiting()){
            Cadastrando...
            }@else{
            Cadastrar Ponto Turístico
            }
        </button>
    </div>
</form>
