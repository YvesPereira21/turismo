<div class="min-h-screen bg-[#f3f4f6] py-10 px-4">
    
    <div class="max-w-4xl mx-auto mb-6 flex items-center justify-between">
        <a routerLink="/manager-dashboard" class="btn bg-[#2C5C3E] hover:bg-[#20442E] text-white border-none rounded-full px-4 btn-sm flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
            </svg>
            Voltar ao Dashboard
        </a>
    </div>

    <div *ngIf="isLoading()" class="flex justify-center py-20">
        <span class="loading loading-spinner loading-lg text-[#2C5C3E]"></span>
    </div>

    <form *ngIf="!isLoading()" [formGroup]="touristSpotForm" (ngSubmit)="onSubmit()" class="w-full max-w-4xl mx-auto p-8 bg-white shadow-lg rounded-2xl space-y-6">

        <div class="border-b pb-4 mb-4">
            <h2 class="text-2xl font-bold text-[#2C5C3E]">Editar Ponto Turístico</h2>
            <p class="text-sm text-gray-500 mt-1">Atualize as informações do local e salve as alterações.</p>
        </div>

        <div class="form-control w-full">
            <label class="label" for="name">
                <span class="label-text font-semibold text-gray-700">Nome do Local</span>
            </label>
            <input id="name" type="text" formControlName="name" placeholder="Ex: Farol do Cabo Branco"
                class="input input-bordered w-full focus:outline-[#4A8C5E]" />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="form-control w-full">
                <label class="label" for="opensAt">
                    <span class="label-text font-semibold text-gray-700">Horário de Abertura</span>
                </label>
                <input id="opensAt" type="time" formControlName="opensAt"
                    class="input input-bordered w-full focus:outline-[#4A8C5E]" />
            </div>

            <div class="form-control w-full">
                <label class="label" for="closesAt">
                    <span class="label-text font-semibold text-gray-700">Horário de Fechamento</span>
                </label>
                <input id="closesAt" type="time" formControlName="closesAt"
                    class="input input-bordered w-full focus:outline-[#4A8C5E]" />
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="form-control w-full">
                <label class="label" for="stateName">
                    <span class="label-text font-semibold text-gray-700">Estado</span>
                </label>
                <select id="stateName" formControlName="stateName" (change)="onStateChange($event)"
                    class="select border border-gray-300 w-full focus:outline-[#4A8C5E] bg-white text-gray-800 font-poppins shadow-sm">
                    <option value="" disabled class="text-gray-400 bg-white">Selecione o estado</option>
                    <option *ngFor="let state of states()" [value]="state.name" class="text-gray-800 bg-white">
                        {{ state.name }}
                    </option>
                </select>
            </div>

            <div class="form-control w-full">
                <label class="label" for="cityName">
                    <span class="label-text font-semibold text-gray-700">Cidade</span>
                </label>
                <select id="cityName" formControlName="cityName"
                    class="select border border-gray-300 w-full focus:outline-[#4A8C5E] bg-white text-gray-800 font-poppins shadow-sm">
                    <option value="" disabled class="text-gray-400 bg-white">
                        {{ cities().length === 0 ? 'Selecione o estado primeiro' : 'Selecione a cidade' }}
                    </option>
                    <option *ngFor="let city of cities()" [value]="city.name" class="text-gray-800 bg-white">
                        {{ city.name }}
                    </option>
                </select>
            </div>
        </div>

        <div class="form-control w-full">
            <label class="label" for="shortDescription">
                <span class="label-text font-semibold text-gray-700">Breve Descrição (Resumo)</span>
            </label>
            <input id="shortDescription" type="text" formControlName="shortDescription"
                placeholder="Uma frase curta sobre o local..."
                class="input input-bordered w-full focus:outline-[#4A8C5E]" />
        </div>

        <div class="form-control w-full">
            <label class="label" for="description">
                <span class="label-text font-semibold text-gray-700">Descrição Completa</span>
            </label>
            <textarea id="description" formControlName="description" rows="4"
                placeholder="Detalhes completos sobre o ponto turístico..."
                class="textarea textarea-bordered w-full focus:outline-[#4A8C5E]"></textarea>
        </div>

        <app-tag-selector [tagsNames]="tagsArray"></app-tag-selector>

        <!-- Seção: Redes Sociais -->
        <div class="space-y-4 pt-4 border-t">
            <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 font-poppins">
                Redes Sociais
            </h3>

            <!-- Instagram -->
            <div class="grid grid-cols-1 md:grid-cols-[140px_1fr] items-center gap-2 md:gap-4">
                <div class="flex items-center gap-2 font-poppins text-sm text-gray-700 font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="text-pink-600 flex-shrink-0">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                    <span>Instagram</span>
                </div>
                <input type="url" formControlName="instagram" placeholder="https://instagram.com/perfil"
                    class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-[#6EB57D] focus:ring-1 focus:ring-[#6EB57D] font-poppins text-gray-700 text-sm shadow-sm transition-all" />
            </div>

            <!-- Facebook -->
            <div class="grid grid-cols-1 md:grid-cols-[140px_1fr] items-center gap-2 md:gap-4">
                <div class="flex items-center gap-2 font-poppins text-sm text-gray-700 font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="text-blue-600 flex-shrink-0">
                        <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
                    </svg>
                    <span>Facebook</span>
                </div>
                <input type="url" formControlName="facebook" placeholder="https://facebook.com/perfil"
                    class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-[#6EB57D] focus:ring-1 focus:ring-[#6EB57D] font-poppins text-gray-700 text-sm shadow-sm transition-all" />
            </div>

            <!-- X -->
            <div class="grid grid-cols-1 md:grid-cols-[140px_1fr] items-center gap-2 md:gap-4">
                <div class="flex items-center gap-2 font-poppins text-sm text-gray-700 font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
                        class="text-gray-900 flex-shrink-0">
                        <path d="M4 4l11.733 16h4.267l-11.733 -16z" />
                        <path d="M4 20l6.768 -6.768m2.46 -2.46l6.772 -6.772" />
                    </svg>
                    <span>X (Twitter)</span>
                </div>
                <input type="url" formControlName="x" placeholder="https://x.com/perfil"
                    class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-[#6EB57D] focus:ring-1 focus:ring-[#6EB57D] font-poppins text-gray-700 text-sm shadow-sm transition-all" />
            </div>
        </div>

        <!-- Adicionar Fotos Novas -->
        <div class="form-control w-full mt-6 pt-4 border-t">
            <label class="label" for="photos">
                <span class="label-text font-semibold text-gray-700">Adicionar Novas Fotos (Opcional)</span>
            </label>

            <input id="photos" type="file" multiple accept="image/*" (change)="onFilesSelected($event)"
                class="file-input file-input-bordered w-full focus:outline-[#4A8C5E]" />

            <div *ngIf="photos().length > 0" class="mt-4 space-y-3 p-4 bg-gray-50 rounded-lg">
                <h4 class="font-semibold text-gray-700 text-sm">Textos Alternativos para novas imagens</h4>

                <div *ngFor="let photo of photos(); let i = index" class="flex flex-col md:flex-row md:items-center gap-3">
                    <span class="text-sm text-gray-600 md:w-1/3 truncate font-medium" [title]="photo.photo.name">
                        {{ photo.photo.name }}
                    </span>

                    <input type="text" placeholder="Descreva a imagem..."
                        [value]="photo.altText" (input)="updateAlternateTextInForm(i, $event)"
                        class="input input-sm input-bordered w-full" />
                </div>
            </div>
        </div>

        <div class="form-control mt-8 flex flex-row gap-4 justify-end">
            <a routerLink="/manager-dashboard" class="btn bg-gray-100 hover:bg-gray-200 text-gray-700 border-none rounded-full px-6 font-medium shadow-sm">Cancelar</a>
            <button type="submit" class="btn bg-[#2C5C3E] hover:bg-[#20442E] text-white border-none rounded-full px-10 shadow-md font-medium"
                [disabled]="isSubmiting() || touristSpotForm.invalid">
                <span *ngIf="isSubmiting()">Salvando...</span>
                <span *ngIf="!isSubmiting()">Salvar Alterações</span>
            </button>
        </div>
    </form>
</div>
