@if (!isEmpty()) {
  <div class="flex justify-center">
    <div class="inline-flex items-center bg-white border border-gray-200 rounded-2xl shadow-sm p-1.5 gap-2">
      <button
        type="button"
        class="btn btn-sm bg-gray-50 hover:bg-gray-100 border-none text-[#2C5C3E] disabled:text-gray-400 disabled:bg-gray-50/50 disabled:opacity-50 disabled:cursor-not-allowed transition-all font-poppins font-medium rounded-xl px-4"
        (click)="onPageChange(currentPage() - 1)" 
        [disabled]="isFirst()">
        « Anterior
      </button>

      <div class="font-poppins text-xs text-gray-600 font-medium px-4 py-1.5 bg-gray-50/80 rounded-xl">
        Página <span class="font-bold text-[#2C5C3E] mx-0.5">{{ currentPage() + 1 }}</span> de <span class="font-bold text-[#2C5C3E] ml-0.5">{{ totalPages() === 0 ? 1 : totalPages() }}</span>
      </div>

      <button
        type="button"
        class="btn btn-sm bg-gray-50 hover:bg-gray-100 border-none text-[#2C5C3E] disabled:text-gray-400 disabled:bg-gray-50/50 disabled:opacity-50 disabled:cursor-not-allowed transition-all font-poppins font-medium rounded-xl px-4"
        (click)="onPageChange(currentPage() + 1)" 
        [disabled]="isLast()">
        Próxima »
      </button>
    </div>
  </div>
}
