<header style="background-color:#2C5C3E" class="w-full">
    <div class="px-12 mx-auto">

        <div class="navbar text-white">
            <div class="navbar-start">
                <h2 class="font-roboto-slab font-semibold text-2xl">
                    Terras
                </h2>
                <h2 class="font-roboto-slab font-semibold text-2xl" style="color: #6EB57D;">
                    Paraibana
                </h2>
            </div>

            <div>
                <div class="grid grid-cols-3 gap-8 w-max mx-auto justify-items-center">
                    <a routerLink="">
                        <div class="flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="flex-shrink-0">
                                <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
                                <path
                                    d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                            </svg>
                            <span>Início</span>
                        </div>
                    </a>

                    <a routerLink="/mapa">
                        <div class="flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                stroke-linejoin="round" class="flex-shrink-0">
                                <path
                                    d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z" />
                                <path d="M15 5.764v15" />
                                <path d="M9 3.236v15" />
                            </svg>
                            <span>Mapa</span>
                        </div>
                    </a>

                    <a routerLink="">
                        <div class="flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                stroke-linejoin="round" class="flex-shrink-0">
                                <path
                                    d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5" />
                            </svg>
                            <span>Favoritos</span>
                        </div>
                    </a>
                </div>
            </div>

            <div class="navbar-end">
                @if (authService.isAuthenticated()) {
                <div class="dropdown dropdown-end">
                    <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
                        <div class="w-10 rounded-full border-2 border-[#6EB57D]">
                            <img alt="Avatar do usuário"
                                src="https://img.daisyui.com/images/profile/demo/yellingcat@192.webp" />
                        </div>
                    </div>
                    <ul tabindex="-1"
                        class="menu dropdown-content bg-emerald-800 rounded-box z-[100] mt-4 w-56 p-2 shadow-xl">
                        @if (authService.currentUser(); as user) {
                        <li class="px-4 py-2 border-b border-white/10">
                            <span class="font-bold text-xs text-emerald-100 p-0 hover:bg-transparent">{{ user.name }}</span>
                        </li>
                        }
                        <li><a routerLink="">Perfil</a></li>
                        <li><a routerLink="">Configurações</a></li>
                        <li><button (click)="logout()" class="text-error font-semibold">Sair</button></li>
                    </ul>
                </div>
                } @else {
                <div class="flex items-center gap-2">
                    <a routerLink="/login"
                        class="btn bg-white/10 hover:bg-white/20 text-white border border-white/30 font-poppins text-xs sm:text-sm px-4">
                        Entrar
                    </a>
                    <a href="http://localhost:8080/oauth2/authorization/google"
                        class="btn bg-white hover:bg-gray-100 text-gray-700 border border-gray-200 font-poppins gap-2 font-medium text-xs sm:text-sm px-3 hidden md:inline-flex">
                        <svg class="w-4 h-4" viewBox="0 0 24 24">
                            <path fill="#4285F4"
                                d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" />
                            <path fill="#34A853"
                                d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.25 21.3 7.31 24 12 24z" />
                            <path fill="#FBBC05"
                                d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.16 0 9.99 0 12s.46 3.84 1.26 5.42l4.02-3.15z" />
                            <path fill="#EA4335"
                                d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z" />
                        </svg>
                        <span>Google</span>
                    </a>
                </div>
                }
            </div>
        </div>

    </div>
</header>
