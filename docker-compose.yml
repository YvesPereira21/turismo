services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: turismo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: turismo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d turismo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: turismo_redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: turismo_app
    restart: unless-stopped
    ports:
      - "8091:8080"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=turismo
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/turismo
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgrespassword
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=superChaveSecretaJWTDoSistemaTurismo12345678
      - TOKEN_SECRET=superChaveSecretaJWTDoSistemaTurismo12345678
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
