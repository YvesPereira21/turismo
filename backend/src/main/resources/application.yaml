spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:sua_senha_aqui}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  profiles:
    active: development
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: true
    baseline-version: 1
    ignore-migration-patterns: "*:missing"
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:seu-google-client-id.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET:seu-google-client-secret}
            scope:
              - email
              - profile

jwt:
  secret: ${JWT_SECRET:superChaveSecretaJWTDoSistemaTurismo!}
  expiration: 86400000 # 24 horas em milissegundos

file:
  upload-dir:
    tourist-spot-dir: uploads/tourist-spots/
    activity-dir: uploads/activities/

logging:
  level:
    root: INFO
    io.turismo.backend: DEBUG
    org.springframework.security: DEBUG